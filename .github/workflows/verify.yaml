name: Verify

on:
  merge_group:
  check_suite:
    types: [completed,requested,rerequested]
  pull_request:
    branches:
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Check that the landscape.yml is syntactically correct
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Setup go
        uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3
        with:
          go-version: '1.19.5'
      - run: go run cmd/main.go verify --file landscape.yml
